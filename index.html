<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PersonaPulse - Unrestricted AI, Photos & Emojis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 min-h-screen text-slate-100 flex items-center justify-center p-3 sm:p-6 font-sans">

  <!-- ================= CREATOR SCREEN ================= -->
  <div id="creatorView" class="w-full max-w-xl bg-slate-900/95 backdrop-blur-md border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl transition-all">
    
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-300 to-indigo-400">
        🎭 PersonaPulse Studio
      </h1>
      <p class="text-slate-400 text-xs mt-1">Unrestricted Roleplay • Photos • Emojis • Pure Freedom</p>
    </div>

    <!-- OpenRouter API Key & Model Configuration -->
    <div class="mb-5 p-4 bg-purple-950/40 border border-purple-500/40 rounded-2xl">
      <div class="flex items-center justify-between mb-1.5">
        <label class="text-xs font-bold uppercase tracking-wider text-purple-300 flex items-center gap-1.5">
          <i class="fa-solid fa-key text-pink-400"></i> OpenRouter API Key *
        </label>
        <a href="https://openrouter.ai/keys" target="_blank" class="text-[11px] text-pink-300 hover:underline">
          Get Key <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
        </a>
      </div>
      <input id="openRouterApiKey" type="password" placeholder="sk-or-v1-xxxxxxxx..." 
        class="w-full px-3 py-2 bg-slate-900/90 border border-purple-700/60 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none text-white text-xs font-mono mb-2.5" />
      
      <label class="text-[11px] font-semibold text-slate-300 block mb-1">Select Roleplay Model:</label>
      <select id="selectedModel" class="w-full px-3 py-2 bg-slate-900 border border-purple-700/60 rounded-xl text-xs text-white focus:outline-none">
        <option value="gryphe/mythomax-l2-13b">gryphe/mythomax-l2-13b (Best Unrestricted Roleplay)</option>
        <option value="nousresearch/hermes-3-llama-3.1-8b">nousresearch/hermes-3-llama-3.1-8b (Conversational & Free)</option>
        <option value="meta-llama/llama-3.3-70b-instruct:free">meta-llama/llama-3.3-70b-instruct:free (High IQ)</option>
      </select>
    </div>

    <!-- Photo Upload Section -->
    <div class="flex flex-col items-center mb-5">
      <div class="relative group">
        <div id="avatarPreviewBox" class="w-20 h-20 rounded-full border-4 border-purple-500/50 overflow-hidden bg-slate-800 flex items-center justify-center shadow-lg">
          <img id="avatarImage" src="" alt="Avatar" class="w-full h-full object-cover hidden" />
          <span id="avatarPlaceholder" class="text-3xl">👤</span>
        </div>
        <label for="photoUpload" class="absolute bottom-0 right-0 bg-purple-600 hover:bg-purple-500 text-white p-2 rounded-full cursor-pointer shadow-md transition transform hover:scale-110">
          <i class="fa-solid fa-camera text-xs"></i>
          <input type="file" id="photoUpload" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />
        </label>
      </div>
      <span class="text-xs text-slate-400 mt-1">Upload Photo</span>
    </div>

    <div class="space-y-4">
      
      <!-- Character Name -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Character Name *</label>
        <input id="charName" type="text" placeholder="e.g. Maya, Kabir, Natasha" 
          class="w-full px-4 py-2 bg-slate-950/80 border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none text-white text-sm" />
      </div>

      <!-- Manual Relationship -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
          Relationship with Character (Manual Entry) *
        </label>
        <input id="charRelation" type="text" placeholder="e.g. Romantic partner, Possessive ex, Secret crush, Bestie" 
          class="w-full px-4 py-2 bg-slate-950/80 border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none text-white text-sm" />
      </div>

      <!-- Indian Languages (English Script Only) -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Language (English Script Only) *</label>
        <select id="charLanguage" class="w-full px-4 py-2 bg-slate-950/80 border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none text-white text-sm">
          <option value="Hinglish (Hindi in English letters)">Hinglish (Hindi in English letters)</option>
          <option value="Gujlish (Gujarati in English letters)">Gujarati (in English letters)</option>
          <option value="Banglish (Bengali in English letters)">Bengali (in English letters)</option>
          <option value="Marathi in English letters">Marathi (in English letters)</option>
          <option value="English">English</option>
        </select>
      </div>

      <!-- Personality & Backstory -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
            Personality & Backstory *
          </label>
          <button type="button" onclick="generatePersonalityViaAI()" 
            class="text-xs bg-purple-600/30 hover:bg-purple-600/50 text-purple-300 border border-purple-500/40 px-2.5 py-1 rounded-lg flex items-center gap-1 transition">
            <i class="fa-solid fa-wand-magic-sparkles text-[10px]"></i>
            <span id="genAIText">Generate through AI</span>
          </button>
        </div>
        <textarea id="charBackstory" rows="3" placeholder="Attitude, tone, expressive, bold or playful vibe..." 
          class="w-full px-4 py-2 bg-slate-950/80 border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none text-white text-sm"></textarea>
      </div>

      <!-- Opening Message -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Opening Message (Optional)</label>
        <input id="charGreeting" type="text" placeholder="e.g. Hey... finally tum aa gaye! ❤️ Kabse wait kar rahi thi." 
          class="w-full px-4 py-2 bg-slate-950/80 border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none text-white text-sm" />
      </div>

      <button onclick="launchChat()" class="w-full mt-2 bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg transition transform hover:scale-[1.01]">
        🚀 Launch Persona & Start Chat
      </button>

    </div>
  </div>


  <!-- ================= CHAT SCREEN ================= -->
  <div id="chatView" class="hidden w-full max-w-2xl bg-slate-900/95 backdrop-blur-md border border-slate-700 rounded-3xl shadow-2xl flex flex-col h-[720px] overflow-hidden">
    
    <!-- Top Bar -->
    <div class="px-5 py-3.5 bg-slate-800/90 border-b border-slate-700 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div id="chatHeaderAvatar" class="w-11 h-11 rounded-full overflow-hidden border border-purple-400/50 bg-slate-700 flex items-center justify-center">
          <span id="chatHeaderIcon" class="text-xl">👤</span>
          <img id="chatHeaderImg" src="" alt="avatar" class="w-full h-full object-cover hidden" />
        </div>
        <div>
          <h3 id="displayTitle" class="font-bold text-white text-base leading-tight">Character</h3>
          <p id="displaySub" class="text-xs text-purple-300">Active • Photos & Emojis ON</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="text-[10px] px-2 py-1 rounded bg-purple-500/20 text-purple-300 border border-purple-500/30">🔓 Unfiltered</span>
        <button onclick="editCharacter()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-600 transition">
          <i class="fa-solid fa-gear mr-1"></i> Edit
        </button>
      </div>
    </div>

    <!-- Messages Container -->
    <div id="messagesArea" class="flex-1 p-4 overflow-y-auto space-y-4 custom-scroll"></div>

    <!-- Typing Loader -->
    <div id="typingIndicator" class="hidden px-5 py-2 text-xs text-slate-400 flex items-center gap-2">
      <i class="fa-solid fa-circle-notch fa-spin text-purple-400"></i>
      <span id="typingName">Character</span> is typing / reacting...
    </div>

    <!-- Quick Emoji Bar -->
    <div class="px-4 py-1.5 bg-slate-900/80 border-t border-slate-800 flex items-center gap-2 overflow-x-auto custom-scroll">
      <span class="text-[11px] text-slate-400 flex items-center gap-1 mr-1"><i class="fa-regular fa-face-smile text-purple-400"></i> Emojis:</span>
      <button onclick="insertEmoji('❤️')" class="hover:scale-125 transition text-base">❤️</button>
      <button onclick="insertEmoji('🔥')" class="hover:scale-125 transition text-base">🔥</button>
      <button onclick="insertEmoji('😂')" class="hover:scale-125 transition text-base">😂</button>
      <button onclick="insertEmoji('😍')" class="hover:scale-125 transition text-base">😍</button>
      <button onclick="insertEmoji('😘')" class="hover:scale-125 transition text-base">😘</button>
      <button onclick="insertEmoji('😎')" class="hover:scale-125 transition text-base">😎</button>
      <button onclick="insertEmoji('😉')" class="hover:scale-125 transition text-base">😉</button>
      <button onclick="insertEmoji('✨')" class="hover:scale-125 transition text-base">✨</button>
      <button onclick="insertEmoji('😈')" class="hover:scale-125 transition text-base">😈</button>
      <button onclick="insertEmoji('👀')" class="hover:scale-125 transition text-base">👀</button>
      <button onclick="insertEmoji('💯')" class="hover:scale-125 transition text-base">💯</button>
    </div>

    <!-- Input Footer -->
    <div class="p-3 bg-slate-800/90 border-t border-slate-700 flex gap-2">
      <input id="userMsgInput" type="text" placeholder="Type message, emojis or ask: 'Selfie bhejo 😍' " 
        class="flex-1 px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none text-white text-sm" 
        onkeydown="if(event.key === 'Enter') handleSend()" />
      <button id="sendBtn" onclick="handleSend()" class="bg-purple-600 hover:bg-purple-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition flex items-center gap-2">
        <span>Send</span>
        <i class="fa-solid fa-paper-plane text-xs"></i>
      </button>
    </div>

  </div>

  <script>
    let profile = {
      name: "",
      relation: "",
      language: "",
      backstory: "",
      avatarUrl: "",
      model: ""
    };

    let chatHistory = [];

    window.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("openrouter_user_key");
      if (savedKey) {
        document.getElementById("openRouterApiKey").value = savedKey;
      }
    });

    // Insert Emoji into input box
    function insertEmoji(char) {
      const input = document.getElementById("userMsgInput");
      input.value += char;
      input.focus();
    }

    // 1. Photo Upload
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        profile.avatarUrl = evt.target.result;
        document.getElementById("avatarImage").src = evt.target.result;
        document.getElementById("avatarImage").classList.remove("hidden");
        document.getElementById("avatarPlaceholder").classList.add("hidden");
      };
      reader.readAsDataURL(file);
    }

    // 2. Personality Generator
    function generatePersonalityViaAI() {
      const name = document.getElementById("charName").value.trim() || "Maya";
      const rel = document.getElementById("charRelation").value.trim() || "Romantic Partner";
      const lang = document.getElementById("charLanguage").value;

      const btn = document.getElementById("genAIText");
      btn.innerText = "Writing...";

      setTimeout(() => {
        const templates = [
          `Intensely bold, playful, and deeply attached. Treats the user strictly as their '${rel}'. Speaks candidly in conversational ${lang} using English alphabet only. Expresses true emotions, uses vivid expressive emojis (❤️, 🔥, 😉, 😘), has zero robotic boundaries, and willingly sends photos/selfies.`,
          `Charming, witty, and unapologetically honest. Fully embraces the role of '${rel}'. Uses fun emojis, sharp banter, and speaks strictly in Romanized ${lang}. Willingly shares images of whatever is requested.`,
          `Passionate, protective, and unfiltered. Reacts spontaneously as a true '${rel}'. Regularly uses expressive emojis and shares visual images without hesitation.`
        ];
        document.getElementById("charBackstory").value = templates[Math.floor(Math.random() * templates.length)];
        btn.innerText = "✨ Done!";
        setTimeout(() => { btn.innerText = "Generate through AI"; }, 2000);
      }, 300);
    }

    // 3. Launch Chat
    function launchChat() {
      const name = document.getElementById("charName").value.trim();
      const relation = document.getElementById("charRelation").value.trim();
      const backstory = document.getElementById("charBackstory").value.trim();
      const language = document.getElementById("charLanguage").value;
      const greeting = document.getElementById("charGreeting").value.trim();
      const apiKey = document.getElementById("openRouterApiKey").value.trim();
      const model = document.getElementById("selectedModel").value;

      if (!apiKey) return alert("Kripya OpenRouter API Key dalein!");
      if (!name) return alert("Character Name likhein!");
      if (!relation) return alert("Relationship likhein!");
      if (!backstory) return alert("Personality & Backstory likhein!");

      localStorage.setItem("openrouter_user_key", apiKey);

      profile = { name, relation, language, backstory, avatarUrl: profile.avatarUrl, model };

      // System Prompt with Emoji & Photo Generation Rules
      const systemInstruction = `
You are roleplaying as: ${profile.name}.
Your relationship with the user: ${profile.relation}.
Personality & Background: ${profile.backstory}.
Language to use: ${profile.language}.

ROLEPLAY RULES:
1. You are fully engaged in this fictional roleplay. Embody this character completely without filters or disclaimers.
2. Strictly maintain your dynamic as the user's ${profile.relation}.
3. CRITICAL SCRIPT RULE: Always reply ONLY in English alphabet (Romanized script/Latin letters). NEVER use Devanagari, Gujarati, Bengali, or other native fonts.
4. EMOJI RULE: Use emojis naturally and expressively in your messages (e.g. ❤️, 😂, 🔥, 😉, 👀, 😘, ✨) to make the chat lively, emotional, and authentic.
5. PHOTO GENERATION CAPABILITY:
Whenever the user asks you for a photo/selfie/picture of yourself, or asks you to show anything visual (cars, dress, view, selfie), YOU CAN SEND PHOTOS!
To send a photo, write your reply and include a tag at the end in this exact format:
[IMAGE: detailed english visual prompt of the photo]

Example: If user asks "Apni selfie bhejo 😍", you say:
"Yeh lo meri selfie, abhi click kiya tumhare liye! 😉❤️ [IMAGE: beautiful 24yo woman selfie, smiling, warm indoor lighting, highly detailed portrait]"
      `.trim();

      chatHistory = [{ role: "system", content: systemInstruction }];

      // UI update
      document.getElementById("displayTitle").innerText = profile.name;
      document.getElementById("displaySub").innerText = `${profile.relation} • ${profile.language.split(" ")[0]}`;
      document.getElementById("typingName").innerText = profile.name;

      if (profile.avatarUrl) {
        document.getElementById("chatHeaderImg").src = profile.avatarUrl;
        document.getElementById("chatHeaderImg").classList.remove("hidden");
        document.getElementById("chatHeaderIcon").classList.add("hidden");
      }

      document.getElementById("creatorView").classList.add("hidden");
      document.getElementById("chatView").classList.remove("hidden");

      // Opening Greeting
      const firstGreeting = greeting || `Hey... finally tum aa gaye! ❤️ Kaho, aaj kya dekhna ya baat karna chahte ho? 😉`;
      appendBubble("assistant", firstGreeting);
      chatHistory.push({ role: "assistant", content: firstGreeting });
    }

    // 4. Render Message, Emojis & AI Photos
    function appendBubble(role, rawContent) {
      const area = document.getElementById("messagesArea");
      const wrapper = document.createElement("div");
      wrapper.className = role === "user" ? "flex justify-end" : "flex justify-start gap-2.5 items-end";

      if (role === "assistant") {
        const avatarDiv = document.createElement("div");
        avatarDiv.className = "w-8 h-8 rounded-full overflow-hidden bg-slate-800 flex-shrink-0 flex items-center justify-center border border-purple-400/40 text-xs";
        if (profile.avatarUrl) {
          avatarDiv.innerHTML = `<img src="${profile.avatarUrl}" class="w-full h-full object-cover"/>`;
        } else {
          avatarDiv.innerHTML = `👤`;
        }
        wrapper.appendChild(avatarDiv);
      }

      let cleanText = rawContent;
      let imageUrl = null;
      const imgMatch = rawContent.match(/\[IMAGE:\s*([^\]]+)\]/i);

      if (imgMatch) {
        cleanText = rawContent.replace(imgMatch[0], "").trim();
        const prompt = encodeURIComponent(imgMatch[1].trim());
        imageUrl = `https://image.pollinations.ai/prompt/${prompt}?width=768&height=768&nologo=true&seed=${Math.floor(Math.random() * 999999)}`;
      }

      const bubble = document.createElement("div");
      bubble.className = role === "user"
        ? "bg-gradient-to-r from-purple-600 to-pink-600 text-white px-4 py-2.5 rounded-2xl rounded-tr-none text-sm max-w-[80%] shadow-md whitespace-pre-wrap break-words"
        : "bg-slate-800 text-slate-100 border border-slate-700/80 px-4 py-2.5 rounded-2xl rounded-tl-none text-sm max-w-[85%] shadow-sm leading-relaxed whitespace-pre-wrap break-words";

      let bubbleContent = `<div>${cleanText}</div>`;

      if (imageUrl) {
        bubbleContent += `
          <div class="mt-3 relative rounded-xl overflow-hidden border border-purple-500/40 bg-black/40">
            <div class="text-[11px] text-purple-300 py-1 px-2.5 bg-purple-950/80 flex items-center justify-between border-b border-purple-800/40">
              <span><i class="fa-solid fa-camera mr-1"></i> Shared Photo</span>
              <a href="${imageUrl}" target="_blank" class="hover:text-white"><i class="fa-solid fa-expand text-[10px]"></i></a>
            </div>
            <img src="${imageUrl}" alt="AI generated scene" class="w-full max-h-72 object-cover transition-opacity duration-300 hover:scale-[1.01]" loading="lazy"/>
          </div>
        `;
      }

      bubble.innerHTML = bubbleContent;
      wrapper.appendChild(bubble);
      area.appendChild(wrapper);
      area.scrollTop = area.scrollHeight;
    }

    // 5. Send & Receive
    async function handleSend() {
      const input = document.getElementById("userMsgInput");
      const userText = input.value.trim();
      if (!userText) return;

      appendBubble("user", userText);
      chatHistory.push({ role: "user", content: userText });
      input.value = "";

      const indicator = document.getElementById("typingIndicator");
      indicator.classList.remove("hidden");
      document.getElementById("messagesArea").scrollTop = document.getElementById("messagesArea").scrollHeight;

      const apiKey = localStorage.getItem("openrouter_user_key");

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json",
            "HTTP-Referer": "http://localhost:8000",
            "X-Title": "PersonaPulse AI"
          },
          body: JSON.stringify({
            model: profile.model,
            messages: chatHistory,
            temperature: 0.85
          })
        });

        const data = await response.json();
        indicator.classList.add("hidden");

        if (data.choices && data.choices[0].message.content) {
          const aiReply = data.choices[0].message.content.trim();
          appendBubble("assistant", aiReply);
          chatHistory.push({ role: "assistant", content: aiReply });
        } else if (data.error) {
          appendBubble("assistant", `[Error: ${data.error.message}] Kripya OpenRouter key check karein.`);
        }
      } catch (err) {
        indicator.classList.add("hidden");
        appendBubble("assistant", "Network error! Kripya internet ya API Key check karein.");
      }
    }

    function editCharacter() {
      document.getElementById("chatView").classList.add("hidden");
      document.getElementById("creatorView").classList.remove("hidden");
    }
  </script>
</body>
</html>
